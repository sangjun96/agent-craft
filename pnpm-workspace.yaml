packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@cloudflare/vite-plugin": 2.0.0-beta.sha-67fa336fd
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
